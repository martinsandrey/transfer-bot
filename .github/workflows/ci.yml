name: CI
on:
  push:
  pull_request:
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - name: Build e simulação (instalação limpa no Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run build
          $p = Start-Process node -ArgumentList "dist/main.js","--simular" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "simulação falhou ($($p.ExitCode))" }
